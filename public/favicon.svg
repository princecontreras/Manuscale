<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#f5f3ff" rx="64"/>
  
  <!-- Main text container -->
  <g transform="translate(128, 128)">
    <!-- "T" letter for favicon - simple and bold -->
    <text x="-30" y="30" font-family="Arial, sans-serif" font-style="italic" font-weight="900" font-size="80" fill="#4a3eb8" text-anchor="middle">T</text>
    
    <!-- "S" letter -->
    <text x="35" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="80" fill="#4a3eb8" text-anchor="middle">S</text>
    
    <!-- Period dot -->
    <circle cx="75" cy="-10" r="12" fill="#6c5ce7"/>
  </g>
</svg>